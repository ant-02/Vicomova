services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: vicomova-mysql
    restart: unless-stopped
    env_file:
      - ./env/mysql.env
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vicomova

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: vicomova-redis
    restart: unless-stopped
    env_file:
      - ./env/redis.env
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vicomova

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: vicomova-etcd
    restart: unless-stopped
    env_file:
      - ./env/etcd.env
    ports:
      - "2379:2379"
    volumes:
      - ./data/etcd:/etcd
    command: etcd --advertise-client-urls=http://0.0.0.0:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    networks:
      - vicomova

  config-sync:
    image: debian:stable-slim
    container_name: vicomova-config-sync
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./script:/app/script
    environment:
      ETCD_ENDPOINTS: "etcd:2379"
    command: >
      bash -c "apt-get update &&
               apt-get install -y -qq etcd-client inotify-tools > /dev/null 2>&1 &&
               chmod +x /app/script/entrypoint.sh &&
               /app/script/entrypoint.sh"
    networks:
      - vicomova
    depends_on:
      - etcd

  kafka:
    image: docker.io/apache/kafka:3.8.0
    container_name: vicomova-kafka
    restart: unless-stopped
    env_file:
      - ./env/kafka.env
    ports:
      - "9092:9092"
    volumes:
      - ./data/kafka:/var/lib/kafka/data
      - ./env/kafka-jaas.conf:/etc/kafka/kafka-jaas.conf
      - ./script/kafka-init.sh:/opt/kafka-init.sh
    networks:
      - vicomova
    depends_on:
      - etcd
    command: >
      bash -c "chmod +x /opt/kafka-init.sh &&
               /opt/kafka-init.sh &&
               /etc/confluent/docker/run"

networks:
  vicomova:
    driver: bridge
