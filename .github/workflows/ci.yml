name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install kitex
        run: go install github.com/cloudwego/kitex/tool/cmd/kitex@latest

      - name: Generate code
        run: |
          export PATH="$HOME/go/bin:$PATH"
          make proto

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

      - name: Build
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install kitex
        run: go install github.com/cloudwego/kitex/tool/cmd/kitex@latest

      - name: Generate code
        run: |
          export PATH="$HOME/go/bin:$PATH"
          make proto

      - name: Run unit tests
        run: go test ./... -v -short

      - name: Run tests with race detector
        run: go test ./... -race -short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.user
          push: false
          tags: vicomova-user:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gateway service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: false
          tags: vicomova-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
