name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.user
          push: false
          tags: vicomova-user:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gateway service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: false
          tags: vicomova-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
