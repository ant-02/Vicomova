version: '3.8'

services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: vicomova-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: vicomova
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: vicomova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: docker.io/library/etcd:3.5
    container_name: vicomova-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 5000
    ports:
      - "2379:2379"
    volumes:
      - ./etcd:/etcd
    command: etcd --advertise-client-urls=http://0.0.0.0:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    networks:
      - vicomova

  user:
    image: vicomova-user:latest
    container_name: vicomova-user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_started
    ports:
      - "8888:8888"
    volumes:
      - ./config:/app/config:ro
    networks:
      - vicomova

  gateway:
    image: vicomova-gateway:latest
    container_name: vicomova-gateway
    restart: unless-stopped
    depends_on:
      user:
        condition: service_started
      etcd:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
    networks:
      - vicomova

networks:
  vicomova:
    driver: bridge
