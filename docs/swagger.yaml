definitions:
  handler.ErrorResponse:
    description: 错误响应
    properties:
      code:
        type: integer
      msg:
        type: string
    type: object
  handler.LoginRequest:
    description: 登录请求
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handler.LoginResponse:
    description: 登录响应
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  handler.LogoutRequest:
    description: 登出请求
    properties:
      access_token:
        type: string
    type: object
  handler.LogoutResponse:
    description: 登出响应
    properties:
      success:
        type: boolean
    type: object
  handler.RefreshTokenRequest:
    description: 刷新Token请求
    properties:
      refresh_token:
        type: string
    type: object
  handler.RefreshTokenResponse:
    description: 刷新Token响应
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  handler.RegisterResponse:
    description: 注册响应
    properties:
      user_id:
        type: integer
      username:
        type: string
    type: object
  handler.SendCodeRequest:
    description: 发送验证码请求
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handler.SendCodeResponse:
    description: 发送验证码响应
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  handler.UserResponse:
    description: 用户响应
    properties:
      created_at:
        type: integer
      email:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  handler.VerifyCodeRequest:
    description: 验证注册请求
    properties:
      code:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handlers.CommentItem:
    properties:
      content:
        type: string
      created_at:
        type: integer
      id:
        type: integer
      like_count:
        type: integer
      parent_id:
        type: integer
      user_id:
        type: integer
      video_id:
        type: integer
    type: object
  handlers.CommentListResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/handlers.CommentItem'
        type: array
      total:
        type: integer
    type: object
  handlers.CommentRequest:
    properties:
      content:
        type: string
      parent_id:
        type: integer
      video_id:
        type: integer
    type: object
  handlers.CoverResponse:
    properties:
      cover_url:
        type: string
    type: object
  handlers.DeleteCommentRequest:
    properties:
      comment_id:
        type: integer
    type: object
  handlers.ErrorResponse:
    properties:
      code:
        type: integer
      msg:
        type: string
    type: object
  handlers.FavoriteItem:
    properties:
      created_at:
        type: integer
      id:
        type: integer
      user_id:
        type: integer
      video:
        $ref: '#/definitions/handlers.VideoItem'
      video_id:
        type: integer
    type: object
  handlers.FavoriteListResponse:
    properties:
      favorites:
        items:
          $ref: '#/definitions/handlers.FavoriteItem'
        type: array
      total:
        type: integer
    type: object
  handlers.FavoriteRequest:
    properties:
      video_id:
        type: integer
    type: object
  handlers.LikeCommentRequest:
    properties:
      comment_id:
        type: integer
    type: object
  handlers.LikeItem:
    properties:
      created_at:
        type: integer
      id:
        type: integer
      target_id:
        type: integer
      target_type:
        type: string
      user_id:
        type: integer
    type: object
  handlers.LikeListResponse:
    properties:
      likes:
        items:
          $ref: '#/definitions/handlers.LikeItem'
        type: array
      total:
        type: integer
    type: object
  handlers.LikeRequest:
    properties:
      video_id:
        type: integer
    type: object
  handlers.PublishVideoRequest:
    properties:
      category_id:
        type: integer
      cover_url:
        type: string
      description:
        type: string
      duration:
        type: integer
      title:
        type: string
      video_url:
        type: string
    type: object
  handlers.SuccessResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.UnfavoriteRequest:
    properties:
      video_id:
        type: integer
    type: object
  handlers.UnlikeRequest:
    properties:
      video_id:
        type: integer
    type: object
  handlers.VideoItem:
    properties:
      category_id:
        type: integer
      comment_count:
        type: integer
      cover_url:
        type: string
      created_at:
        type: integer
      description:
        type: string
      duration:
        type: integer
      id:
        type: integer
      like_count:
        type: integer
      title:
        type: string
      user_id:
        type: integer
      video_url:
        type: string
      view_count:
        type: integer
    type: object
  handlers.VideoListResponse:
    properties:
      total:
        type: integer
      videos:
        items:
          $ref: '#/definitions/handlers.VideoItem'
        type: array
    type: object
  handlers.VideoStreamResponse:
    properties:
      title:
        type: string
      video_url:
        type: string
    type: object
info:
  contact: {}
paths:
  /comment/like:
    post:
      consumes:
      - application/json
      description: 点赞评论（需要认证）
      parameters:
      - description: 点赞评论请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LikeCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 点赞评论
      tags:
      - comment-like
  /user:
    get:
      description: 获取当前登录用户的信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户信息
      tags:
      - user
  /user/login:
    post:
      consumes:
      - application/json
      description: 用户登录获取Token
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 用户登录
      tags:
      - user
  /user/logout:
    post:
      consumes:
      - application/json
      description: 登出并使refresh_token失效
      parameters:
      - description: 登出请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LogoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 用户登出
      tags:
      - user
  /user/refresh:
    post:
      consumes:
      - application/json
      description: 使用refresh_token获取新的access_token
      parameters:
      - description: 刷新Token请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 刷新Token
      tags:
      - user
  /user/register/send:
    post:
      consumes:
      - application/json
      description: 发送注册验证码到用户邮箱
      parameters:
      - description: 发送验证码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SendCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SendCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 发送邮箱验证码
      tags:
      - user
  /user/register/verify:
    post:
      consumes:
      - application/json
      description: 使用邮箱验证码完成用户注册
      parameters:
      - description: 验证注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 验证邮箱并完成注册
      tags:
      - user
  /video/comment:
    delete:
      consumes:
      - application/json
      description: 删除自己的评论（需要认证）
      parameters:
      - description: 删除评论请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.DeleteCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除评论
      tags:
      - video-comment
    post:
      consumes:
      - application/json
      description: 对视频进行评论（需要认证）
      parameters:
      - description: 评论请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 评论视频
      tags:
      - video-comment
  /video/comment/list:
    get:
      description: 获取视频的评论列表
      parameters:
      - description: 视频ID
        format: int64
        in: query
        name: video_id
        required: true
        type: integer
      - default: 0
        description: 父评论ID (0表示根评论)
        format: int64
        in: query
        name: parent_id
        type: integer
      - default: 1
        description: 页码
        format: int32
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        format: int32
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CommentListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取评论列表
      tags:
      - video-comment
  /video/cover:
    get:
      description: 获取视频封面地址
      parameters:
      - description: 视频ID
        format: int64
        in: query
        name: video_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CoverResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取视频封面
      tags:
      - video
  /video/favorite:
    delete:
      consumes:
      - application/json
      description: 从收藏夹移除视频（需要认证）
      parameters:
      - description: 取消收藏请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UnfavoriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 取消收藏视频
      tags:
      - video-favorite
    post:
      consumes:
      - application/json
      description: 添加视频到收藏夹（需要认证）
      parameters:
      - description: 收藏请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.FavoriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 收藏视频
      tags:
      - video-favorite
  /video/favorite/list:
    get:
      description: 获取用户收藏的视频列表（需要认证）
      parameters:
      - default: 1
        description: 页码
        format: int32
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        format: int32
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.FavoriteListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取收藏列表
      tags:
      - video-favorite
  /video/hot:
    get:
      description: 获取热门视频列表（基于热度算法）
      parameters:
      - default: 10
        description: 返回数量
        format: int32
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VideoListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取热门视频
      tags:
      - video
  /video/like:
    delete:
      consumes:
      - application/json
      description: 取消点赞视频（需要认证）
      parameters:
      - description: 取消点赞请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UnlikeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 取消点赞视频
      tags:
      - video-like
    post:
      consumes:
      - application/json
      description: 点赞视频（需要认证）
      parameters:
      - description: 点赞请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LikeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 点赞视频
      tags:
      - video-like
  /video/like/list:
    get:
      description: 获取用户点赞列表（需要认证）
      parameters:
      - default: video
        description: 目标类型 (video/comment)
        in: query
        name: target_type
        type: string
      - default: 1
        description: 页码
        format: int32
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        format: int32
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LikeListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取点赞列表
      tags:
      - video-like
  /video/list:
    get:
      description: 分页获取指定类别的视频列表
      parameters:
      - description: 分类ID
        format: int32
        in: query
        name: category_id
        required: true
        type: integer
      - default: 1
        description: 页码
        format: int32
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        format: int32
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VideoListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 按类别获取视频列表
      tags:
      - video
  /video/list/published:
    get:
      description: 获取用户发布的视频列表（需要认证）
      parameters:
      - default: 1
        description: 页码
        format: int32
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        format: int32
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VideoListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取发布列表
      tags:
      - video
  /video/publish:
    post:
      consumes:
      - application/json
      description: 发布新视频（需要认证）
      parameters:
      - description: 投稿信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.PublishVideoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 投稿视频
      tags:
      - video
  /video/stream:
    get:
      description: 获取视频播放地址
      parameters:
      - description: 视频ID
        format: int64
        in: query
        name: video_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VideoStreamResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取视频流
      tags:
      - video
swagger: "2.0"
