syntax = "proto3";

package video;

option go_package = "vicomova/third_party/kitex_gen/video";

service VideoService {
    rpc SaveVideo(SaveVideoRequest) returns (SaveVideoResponse);
    rpc SubmitVideo(SubmitVideoRequest) returns (SubmitVideoResponse);
    rpc PublishVideo(PublishVideoRequest) returns (PublishVideoResponse);
    rpc GetVideoStream(GetVideoStreamRequest) returns (GetVideoStreamResponse);
    rpc ListByCategory(ListByCategoryRequest) returns (ListByCategoryResponse);
    rpc ListHotVideos(ListHotVideosRequest) returns (ListHotVideosResponse);
    rpc GetPublishedList(GetPublishedListRequest) returns (GetPublishedListResponse);
    rpc IncrementView(IncrementViewRequest) returns (IncrementViewResponse);
    rpc GetUploadToken(GetUploadTokenRequest) returns (GetUploadTokenResponse);
}

message SaveVideoRequest {
    int64 video_id = 1; // 可选，有则更新，无则创建
    int64 user_id = 2;
    string title = 3;
    string description = 4;
    int32 category_id = 5;
    string cover_url = 6;
    string video_url = 7;
    int32 duration = 8;
}

message SaveVideoResponse {
    int64 video_id = 1;
}

message SubmitVideoRequest {
    int64 video_id = 1;
    int64 user_id = 2;
}

message SubmitVideoResponse {
    int64 video_id = 1;
}

message PublishVideoRequest {
    int64 video_id = 1;
}

message PublishVideoResponse {
    int64 video_id = 1;
}

message GetVideoStreamRequest {
    int64 video_id = 1;
}

message GetVideoStreamResponse {
    int64 id = 1;
    int64 user_id = 2;
    string title = 3;
    string description = 4;
    string cover_url = 5;
    string video_url = 6;
    int32 category_id = 7;
    int64 view_count = 8;
    int64 like_count = 9;
    int64 comment_count = 10;
    int32 duration = 11;
}

message ListByCategoryRequest {
    int32 category_id = 1;
    int32 page = 2;
    int32 size = 3;
}

message ListByCategoryResponse {
    repeated Video videos = 1;
    int64 total = 2;
}

message ListHotVideosRequest {
    int32 limit = 1;
    string cursor = 2;
}

message ListHotVideosResponse {
    repeated Video videos = 1;
    string next_cursor = 2;
    bool has_more = 3;
}

message GetPublishedListRequest {
    int64 user_id = 1;
    int32 page = 2;
    int32 size = 3;
    string cursor = 4;
}

message GetPublishedListResponse {
    repeated Video videos = 1;
    int64 total = 2;
    string next_cursor = 3;
    bool has_more = 4;
}

message IncrementViewRequest {
    int64 video_id = 1;
}

message IncrementViewResponse {}

message GetUploadTokenRequest {
    int64 video_id = 1; // 视频ID，用于生成唯一的文件key
    int32 upload_type = 2; // 上传类型：1=video, 2=cover
}

message GetUploadTokenResponse {
    string token = 1;
    string key = 2;          // 实际使用的 key
    string domain = 3;       // OSS domain，前端用于拼接完整 URL
    string host = 4;         // 七牛云上传地址
}

message Video {
    int64 id = 1;
    int64 user_id = 2;
    string title = 3;
    string description = 4;
    string cover_url = 5;
    string video_url = 6;
    int32 category_id = 7;
    int64 view_count = 8;
    int64 like_count = 9;
    int64 comment_count = 10;
    int32 duration = 11;
    int64 created_at = 12;
    string user_name = 13;
}
