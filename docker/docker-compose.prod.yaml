version: '3.8'

services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: vicomova-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: vicomova
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: vicomova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  user:
    image: vicomova-user:latest
    container_name: vicomova-user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - ./config:/app/config:ro
    networks:
      - vicomova

  gateway:
    image: vicomova-gateway:latest
    container_name: vicomova-gateway
    restart: unless-stopped
    depends_on:
      user:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
    networks:
      - vicomova

networks:
  vicomova:
    driver: bridge
