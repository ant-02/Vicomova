definitions:
  handler.ErrorResponse:
    description: 错误响应
    properties:
      code:
        type: integer
      msg:
        type: string
    type: object
  handler.LoginRequest:
    description: 登录请求
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handler.LoginResponse:
    description: 登录响应
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  handler.LogoutRequest:
    description: 登出请求
    properties:
      access_token:
        type: string
    type: object
  handler.LogoutResponse:
    description: 登出响应
    properties:
      success:
        type: boolean
    type: object
  handler.RefreshTokenRequest:
    description: 刷新Token请求
    properties:
      refresh_token:
        type: string
    type: object
  handler.RefreshTokenResponse:
    description: 刷新Token响应
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  handler.RegisterResponse:
    description: 注册响应
    properties:
      user_id:
        type: integer
      username:
        type: string
    type: object
  handler.SendCodeRequest:
    description: 发送验证码请求
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  handler.SendCodeResponse:
    description: 发送验证码响应
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  handler.UserResponse:
    description: 用户响应
    properties:
      created_at:
        type: integer
      email:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  handler.VerifyCodeRequest:
    description: 验证注册请求
    properties:
      code:
        type: string
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /user:
    get:
      description: 获取当前登录用户的信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户信息
      tags:
      - user
  /user/login:
    post:
      consumes:
      - application/json
      description: 用户登录获取Token
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 用户登录
      tags:
      - user
  /user/logout:
    post:
      consumes:
      - application/json
      description: 登出并使refresh_token失效
      parameters:
      - description: 登出请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.LogoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 用户登出
      tags:
      - user
  /user/refresh:
    post:
      consumes:
      - application/json
      description: 使用refresh_token获取新的access_token
      parameters:
      - description: 刷新Token请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 刷新Token
      tags:
      - user
  /user/register/send:
    post:
      consumes:
      - application/json
      description: 发送注册验证码到用户邮箱
      parameters:
      - description: 发送验证码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SendCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SendCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 发送邮箱验证码
      tags:
      - user
  /user/register/verify:
    post:
      consumes:
      - application/json
      description: 使用邮箱验证码完成用户注册
      parameters:
      - description: 验证注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 验证邮箱并完成注册
      tags:
      - user
swagger: "2.0"
